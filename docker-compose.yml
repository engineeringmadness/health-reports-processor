x-common-variables: &common-variables
  PREFECT_API_URL: http://host.docker.internal:4200/api
  PG_USER: postgres
  PG_APP_SCHEMA: app_main
  PG_PASSWORD: ${PG_PASSWORD}
  PG_HOST: host.docker.internal
  PG_PORT: 5455
  PG_DATABASE: prescriptions
  ANTHROPIC_KEY: ${ANTHROPIC_KEY}
  OCR_MODEL: claude-3-5-sonnet-20240620
  STRUCTURED_OUTPUTS_MODEL: claude-3-haiku-20240307


services:

  postgres:
    image: postgres:14-alpine
    ports:
      - "5455:5455"
    volumes:
      - C:/Users/${USERNAME}/LocalPostgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    networks:
      - default
    command: -p 5455

  server:
    image: prefecthq/prefect:3.0.8-python3.12
    restart: always
    volumes:
      - prefect:/root/.prefect
    entrypoint: ["/opt/prefect/entrypoint.sh", "prefect", "server", "start"]
    environment:
      <<: *common-variables
      PREFECT_UI_URL: http://host.docker.internal:4200/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:${PG_PASSWORD}@host.docker.internal:5455/prescriptions
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: true
      PREFECT_LOCAL_STORAGE_PATH: '/root/results/'
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"
    networks:
      - default
    depends_on:
      - postgres


  rx-flow:
    image: rx-workflow:0.1.0
    entrypoint: ["python", "workflow/deploy_main_flow.py"]
    volumes:
      - C:/Users/${USERNAME}/OneDrive/Desktop:/input
    environment:
      <<: *common-variables
    networks:
      - default
    depends_on:
      - server

  healthcheck:
    image: rx-workflow:0.1.0
    entrypoint: ["python", "workflow/deploy_healthcheck.py"]
    volumes:
      - C:/Users/${USERNAME}/OneDrive/Desktop:/input
    environment:
      <<: *common-variables
    networks:
      - default
    depends_on:
      - server


volumes:
  prefect:

networks:
  default:
    name: prefect-network